AWSTemplateFormatVersion: '2010-09-09'
Description: Creates an Amazon Connect instance in us-east-1

Parameters:
  InstanceAlias:
    Type: String
    Description: A unique name for the Connect instance
    AllowedPattern: '^[a-z][a-z0-9-]+$'
    ConstraintDescription: Must start with a lowercase letter and contain only lowercase letters, numbers, and hyphens

Resources:
  ConnectInstance:
    Type: AWS::Connect::Instance
    Properties:
      IdentityManagementType: CONNECT_MANAGED
      InstanceAlias: !Ref InstanceAlias
      Attributes:
        InboundCalls: true
        OutboundCalls: true

Outputs:
  InstanceId:
    Description: The ID of the Connect instance
    Value: !Ref ConnectInstance
  InstanceArn:
    Description: The ARN of the Connect instance
    Value: !GetAtt ConnectInstance.Arn
